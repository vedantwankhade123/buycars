[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: direct navigation and refreshes on nested routes must resolve
# to the app shell, not Netlify's 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Netlify Functions (Cloudinary signed uploads, listing moderation) live here
# from Phase 7 onward. Directory is created when the first function is added.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
